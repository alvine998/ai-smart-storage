services:
  redis:
    image: redis:7-alpine
    # No ports published: host 6379 is already in use (system redis / other project).
    # api reaches it via docker DNS redis:6379, so no host binding is needed.

  api:
    build: .
    env_file: .env
    environment:
      # Container must listen on 8080 to match the port mapping below.
      # Overrides APP_PORT from .env (which is for `go run` without docker).
      APP_PORT: "8080"
      # MYSQL_DSN is NOT set here on purpose — it comes from .env via env_file.
      # redis service name resolves inside docker network, not localhost.
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "4009:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
