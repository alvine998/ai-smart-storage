services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_storage
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
