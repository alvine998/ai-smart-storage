services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      # Container must listen on 8080 to match the port mapping below.
      # Overrides APP_PORT=4000 from .env (which is for `go run` without docker).
      APP_PORT: "8080"
      # Use MySQL installed on the Linux host (systemd), not a container.
      # host.docker.internal resolves to the host via host-gateway (Linux).
      # Credentials must match your host MySQL user (same as local .env).
      MYSQL_DSN: "alvineyoga:alvine1234@tcp(host.docker.internal:3306)/ai_storage?parseTime=true"
      # redis service name resolves inside docker network, not localhost.
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "4009:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
