name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate: nothing builds or deploys unless vet + tests pass first.
  test:
    name: Gate (vet + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -race -count=1

  docker:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS over SSH
    needs: docker
    # Deploy on pushes to main and manual dispatches. Tag pushes only publish the image.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # NOTE: the `env` context can't be referenced inside a job-level `env:`
      # block, so use the `github` context (which is available here) directly.
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: IMAGE
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull "$IMAGE"
            docker run --rm --env-file .env --entrypoint /bin/sh "$IMAGE" -c '
              required="MYSQL_DSN R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY MIMO_API_KEY MIMO_BASE_URL MIMO_MODEL WHATSAPP_VERIFY_TOKEN WHATSAPP_APP_SECRET WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_GRAPH_VERSION"
              for name in $required; do
                eval "value=\${$name:-}"
                if [ -z "$value" ]; then
                  echo "Missing required deployment variable: $name"
                  exit 1
                fi
              done
              case "$MYSQL_DSN" in
                *"tcp(localhost:"*|*"tcp(127.0.0.1:"*)
                  echo "MYSQL_DSN points to loopback inside the API container; use the Compose MySQL service name or host.docker.internal"
                  exit 1
                  ;;
              esac
            '
            # docker-compose.yml supports ${API_IMAGE}: the pulled image is used instead of a local build.
            API_IMAGE="$IMAGE" docker compose config --quiet
            API_IMAGE="$IMAGE" docker compose pull api
            API_IMAGE="$IMAGE" docker compose up -d --remove-orphans
            docker image prune -f
            healthy=0
            for attempt in $(seq 1 12); do
              if curl -fsS http://localhost:4009/health; then
                healthy=1
                break
              fi
              sleep 5
            done
            docker compose ps
            if [ "$healthy" -ne 1 ]; then
              docker compose logs --tail=100 api
              echo "API health check failed"
              exit 1
            fi
            docker compose logs --tail=50 api
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
